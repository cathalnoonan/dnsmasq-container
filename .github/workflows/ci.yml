name: CI

on:
  push:
    branches:
      - '**'

# Note: GitHub actions uses localhost's port 53 already; so we need to use a different port (i.e. 1053 below)

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build -t dnsmasq-container .

      - name: Run container (detached)
        run: |
          docker run -d \
            --name dnsmasq \
            -p 1053:53/udp \
            -p 1053:53/tcp \
            -v $(pwd)/sample/templates:/opt/dnsmasq/templates \
            dnsmasq-container

      - name: Sleep to allow container to start & healthcheck to run
        run: |
          sleep 15

      - name: Check A records
        run: |
          [ "$(dig -p 1053 +tcp +short @127.0.0.1 dev.example.com)" = "192.168.0.1" ]
          [ "$(dig -p 1053 +tcp +short @127.0.0.1 test.example.com)" = "192.168.0.2" ]
          [ "$(dig -p 1053 +tcp +short @127.0.0.1 prod.example.com)" = "192.168.0.3" ]

      - name: Check CNAME record
        run: |
          [ "$(dig -p 1053 +tcp +short @127.0.0.1 dummy.example.com)" = "192.168.0.3" ]

      - name: Check healthcheck status
        run: |
          STATUS=$(docker inspect --format='{{json .State.Health.Status}}' dnsmasq)
          echo "Container health status: $STATUS"
          [ "$STATUS" = '"healthy"' ]
